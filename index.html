<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IZZO Network — 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #05080f; font-family: Inter, system-ui, sans-serif; }
    #c { display: block; width: 100%; height: 100%; }
    .hud {
      position: fixed; inset: 0; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 28px 32px; color: #e8f0ff;
    }
    .hud h1 {
      font-size: clamp(22px, 4vw, 42px); font-weight: 700; letter-spacing: -0.03em;
      text-shadow: 0 0 24px rgba(56, 140, 255, 0.45);
    }
    .hud p { margin-top: 8px; color: #8aa0c8; font-size: 14px; max-width: 420px; }
    .cta {
      pointer-events: auto; align-self: flex-start;
      background: #1a6dff; color: #fff; border: 0; border-radius: 999px;
      padding: 12px 22px; font-weight: 600; cursor: pointer; text-decoration: none;
    }
    .hint { color: #6b7fa3; font-size: 12px; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud">
    <div>
      <h1>Smarter Tech for Home and Business</h1>
      <p>Drag to orbit. Scroll to zoom. A live 3D scene for IZZO Network.</p>
    </div>
    <div>
      <a class="cta" href="https://www.izzonetwork.com/" target="_blank" rel="noopener">Get a free estimate</a>
      <p class="hint" style="margin-top:10px">(609) 415-0011</p>
    </div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x05080f, 0.035);
    scene.background = new THREE.Color(0x05080f);

    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(4.2, 2.4, 5.4);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.minDistance = 3;
    controls.maxDistance = 14;
    controls.target.set(0, 0.2, 0);

    scene.add(new THREE.AmbientLight(0x4a6aa8, 0.55));
    const key = new THREE.DirectionalLight(0x7ab0ff, 1.4);
    key.position.set(4, 6, 3);
    scene.add(key);
    const rim = new THREE.PointLight(0x3d7cff, 8, 20);
    rim.position.set(-3, 1.5, -2);
    scene.add(rim);

    const core = new THREE.Mesh(
      new THREE.IcosahedronGeometry(1.15, 1),
      new THREE.MeshStandardMaterial({
        color: 0x1a6dff,
        metalness: 0.55,
        roughness: 0.25,
        emissive: 0x0a2a66,
        emissiveIntensity: 0.35
      })
    );
    scene.add(core);

    const wire = new THREE.Mesh(
      new THREE.IcosahedronGeometry(1.18, 1),
      new THREE.MeshBasicMaterial({ color: 0x9ec4ff, wireframe: true, transparent: true, opacity: 0.35 })
    );
    scene.add(wire);

    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(2.05, 0.035, 16, 96),
      new THREE.MeshStandardMaterial({ color: 0x5aa2ff, metalness: 0.8, roughness: 0.2, emissive: 0x12366a })
    );
    ring.rotation.x = Math.PI / 2.4;
    scene.add(ring);

    const ring2 = ring.clone();
    ring2.rotation.x = Math.PI / 1.7;
    ring2.rotation.z = 0.6;
    ring2.scale.setScalar(0.78);
    scene.add(ring2);

    const nodes = new THREE.Group();
    const nodeGeo = new THREE.SphereGeometry(0.07, 16, 16);
    const nodeMat = new THREE.MeshStandardMaterial({ color: 0xd8e8ff, emissive: 0x3a7fff, emissiveIntensity: 1.2 });
    for (let i = 0; i < 18; i++) {
      const n = new THREE.Mesh(nodeGeo, nodeMat);
      const a = (i / 18) * Math.PI * 2;
      n.position.set(Math.cos(a) * 2.05, Math.sin(a * 1.7) * 0.35, Math.sin(a) * 2.05);
      nodes.add(n);
    }
    scene.add(nodes);

    const stars = new THREE.Points(
      (() => {
        const g = new THREE.BufferGeometry();
        const p = new Float32Array(900);
        for (let i = 0; i < p.length; i++) p[i] = (Math.random() - 0.5) * 30;
        g.setAttribute('position', new THREE.BufferAttribute(p, 3));
        return g;
      })(),
      new THREE.PointsMaterial({ color: 0x8eb6ff, size: 0.03 })
    );
    scene.add(stars);

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    function tick(t) {
      const s = t * 0.001;
      core.rotation.y = s * 0.35;
      core.rotation.x = s * 0.12;
      wire.rotation.y = -s * 0.28;
      ring.rotation.z = s * 0.4;
      ring2.rotation.y = s * 0.25;
      nodes.rotation.y = s * 0.4;
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
